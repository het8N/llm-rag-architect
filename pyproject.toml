[project]
name = "llm-rag-architect"
version = "0.1.0"
description = "Production-ready RAG over Premier League clubs' annual financial reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rag_architect --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_architect"]

[[tool.mypy.overrides]]
module = ["pymupdf4llm.*", "fitz.*"]
ignore_missing_imports = true
